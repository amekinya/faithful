name: Run a pipeline step (live models)
# Actions tab -> "Run a pipeline step" -> Run workflow, or commit .github/requests/run.json = {"task": "...", "args": "..."}.
#   synth  : write synthetic visits (args e.g. "--n 60 --split trainval" or "--n 20 --split test --generator Qwen/...") then rebuild pairs
#   tts    : voice the scripted visits with Kokoro (CPU)
#   demo   : run the scripted visits through speech recognition + checks (needs ENDPOINT_URL for the Nebius endpoint)
#   eval   : benchmark (args e.g. "--sets synth,aces,visits --methods code,lightning,ultra --n 400")
on:
  push:
    paths: [".github/requests/run.json"]
  workflow_dispatch:
    inputs:
      task: { description: "synth | synth_all | tts | demo | eval | report", required: true, default: "eval", type: choice, options: [synth, synth_all, tts, demo, eval, report] }
      args: { description: "extra arguments", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: run, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Which step
        env:
          EVENT: ${{ github.event_name }}
          IN_TASK: ${{ inputs.task }}
          IN_ARGS: ${{ inputs.args }}
        run: |
          if [ "$EVENT" = "push" ]; then
            TASK=$(python3 -c "import json;print(json.load(open('.github/requests/run.json'))['task'])")
            ARGS=$(python3 -c "import json;print(json.load(open('.github/requests/run.json')).get('args',''))")
          else
            TASK="$IN_TASK"; ARGS="$IN_ARGS"
          fi
          # Only known steps, and arguments made of flags, words, numbers, commas, dots, slashes and dashes.
          case "$TASK" in synth|synth_all|tts|demo|eval|report) ;; *) echo "unknown task: $TASK"; exit 2 ;; esac
          if ! printf '%s' "$ARGS" | grep -Eq '^[A-Za-z0-9 ,._/=-]*$'; then echo "arguments contain characters that aren't allowed"; exit 2; fi
          echo "TASK=$TASK" >> "$GITHUB_ENV"; echo "ARGS=$ARGS" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Speech tools
        if: env.TASK == 'tts'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install "kokoro>=0.9.4" soundfile "misaki[en]"
      - name: Run
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          ENDPOINT_TOKEN: ${{ secrets.ENDPOINT_TOKEN }}
          DAILY_SPEND_CAP_USD: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p eval
          echo "step: $TASK $ARGS"
          case "$TASK" in
            synth) python -m scripts.synth $ARGS 2>&1 | tee -a eval/synth_log.txt; python -m scripts.build_pairs | tee -a eval/synth_log.txt ;;
            synth_all)  # training visits by one writer, test visits by a different writer and seed, then pairs, in one commit
              python -m scripts.synth --n 64 --split trainval --generator deepseek-ai/DeepSeek-V4.1-Flash-1017 2>&1 | tee -a eval/synth_log.txt
              python -m scripts.synth --n 24 --split test --seed 101 --generator Qwen/Qwen3-30B-A3B-Instruct-2507 2>&1 | tee -a eval/synth_log.txt
              python -m scripts.build_pairs | tee -a eval/synth_log.txt ;;
            tts)   python -m scripts.tts $ARGS 2>&1 | tee eval/tts_log.txt ;;
            demo)  python -m scripts.build_demo $ARGS 2>&1 | tee eval/demo_log.txt ;;
            eval)  python -m eval.run_eval $ARGS 2>&1 | tee eval/eval_log.txt; cat eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY" ;;
            report)  # copy the training job's report (metrics.json on the bucket) from the endpoint into eval/training.json
              python - <<'PY'
          import json, os, httpx
          r = httpx.get(os.environ["ENDPOINT_URL"].rstrip("/") + "/metrics/faithful-checker", timeout=60,
                        headers={"Authorization": f"Bearer {os.environ['ENDPOINT_TOKEN']}"} if os.environ.get("ENDPOINT_TOKEN") else {})
          r.raise_for_status()
          d = r.json()
          assert d.get("name") == "faithful-checker" and "fine_tuned" in d, d
          open("eval/training.json", "w").write(json.dumps(d, indent=1))
          print(json.dumps({k: d[k] for k in ("train_pairs", "epochs", "gpu", "seconds", "threshold")}), "base AUC", d["base_model"]["test_auc"], "tuned AUC", d["fine_tuned"]["test_auc"])
          PY
              ;;
            *) echo "unknown task $TASK"; exit 2 ;;
          esac
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in eval data app/static/audio; do [ -e "$p" ] && git add "$p"; done
          git commit -m "Pipeline step results: $TASK" || echo "No changes"
          for i in 1 2 3 4; do if git pull --rebase -q && git push; then exit 0; fi; sleep 7; done
          git log origin/main..HEAD --oneline | grep -q . && { echo "couldn't push the results"; exit 1; } || true
