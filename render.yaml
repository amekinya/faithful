services:
  - type: web
    name: faithful
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: ENDPOINT_URL
        sync: false
      - key: ENDPOINT_TOKEN
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "2"
